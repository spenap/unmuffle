name: Build

# Skipped when only Markdown or docs/ changed.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# Read-only token; actions pinned to commits.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout with submodules (whisper.cpp is a git submodule)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0 # versionCode is the commit count, versionName comes from git describe

      # 2. Set up JDK 17 (required by AGP 9)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # 3. NDK and CMake, installed into the runner's Android SDK
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"

      # 4. Cache Gradle dependencies
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-

      # 5. Compiled C++ kept between runs: whisper.cpp and ggml's 8 CPU
      #    backends rarely change. CMake reads the launcher from the
      #    environment; the app's build files don't know about ccache.
      #    No CCACHE_BASEDIR: it makes source paths relative, which
      #    -ffile-prefix-map then misses, and the APK differs.
      - name: Install ccache
        run: sudo apt-get install -y -qq ccache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      # 6. Unit tests, lint, the instrumented tests and both APKs in one
      #    Gradle run. The release APK is signed with the debug key; releases
      #    are signed locally by scripts/release.sh.
      - name: Test and build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: string:ndk-27.2.12479018
          CCACHE_MAXSIZE: 500M
        run: |
          export CCACHE_DIR=$HOME/.ccache
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease
          ccache --show-stats

      - name: Release APK has no debug-only code or assets
        run: scripts/check-release-apk.sh

      # For scripts/repro-check.sh: compare a local build with this one
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
