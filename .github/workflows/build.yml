name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout with submodules (whisper.cpp is a git submodule)
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # versionCode is the commit count, versionName comes from git describe

      # 2. Set up JDK 17 (required by AGP 9)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. NDK and CMake, installed into the runner's Android SDK
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"

      # 4. Cache Gradle dependencies
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-

      # 5. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Instrumented tests build
        run: ./gradlew assembleDebugAndroidTest

      # 6. Run Android lint
      - name: Run lint
        run: ./gradlew lintDebug

      # 7. Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 8. Release APK, signed with the debug key; releases are signed locally
      #    by scripts/release.sh
      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Release APK has no debug-only code or assets
        run: scripts/check-release-apk.sh

      # For scripts/repro-check.sh: compare a local build with this one
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
